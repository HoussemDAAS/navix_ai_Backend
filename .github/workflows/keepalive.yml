name: Keep Render services awake

# Free Render instances spin down after 15 minutes without traffic and take
# 1 to 3 minutes to come back. The first request is what wakes an instance,
# so a slow or failed ping still did its job: this workflow retries a few
# times and never fails the run on a slow start (a warning is logged instead).
on:
  schedule:
    - cron: "*/10 8-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the services
        run: |
          wake() {
            url="$1"; label="$2"
            for attempt in 1 2 3 4; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -m 120 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "$label is awake (attempt $attempt)"
                return 0
              fi
              echo "$label answered $code on attempt $attempt, waiting 20 s"
              sleep 20
            done
            echo "::warning::$label did not answer 200 after 4 attempts; it is probably still booting"
            return 0
          }

          wake https://navix-api-9g9p.onrender.com/health "API"

          # The AI service only stays awake 09:00 to 18:59 UTC to stay under
          # Render's 750 free instance hours per month for the workspace.
          hour=$(date -u +%H)
          if [ "$hour" -ge 9 ] && [ "$hour" -lt 19 ]; then
            wake https://navix-ai-service.onrender.com/health "AI service"
          else
            echo "outside the AI service window, skipped"
          fi
